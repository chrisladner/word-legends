<!doctype html>
<!-- Quelle für das App-Icon. Rendern: siehe README ("Icons neu erzeugen"). ?s=0.62 für die maskable-Variante -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=block">
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; }
  body {
    position: relative;
    background: radial-gradient(120% 85% at 50% 0%, #5866FF 0%, #2E3BD9 52%, #1E2AA8 100%);
  }
  body::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle, rgba(255, 255, 255, .17) 6px, transparent 8px) 0 0 / 52px 52px;
    -webkit-mask-image: linear-gradient(#000 0%, rgba(0, 0, 0, .3) 45%, transparent 75%);
  }
  .fan { position: absolute; left: 50%; top: 53%; width: 0; height: 0; transform: scale(var(--s, .78)); z-index: 1; }
  .card {
    position: absolute;
    width: 400px;
    height: 560px;
    left: -200px;
    top: -300px;
    background: #fff;
    border: 28px solid #131849;
    border-radius: 64px;
    box-shadow: 0 30px 0 #131849;
    transform-origin: 50% 135%;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 118px;
    background: var(--c);
    border-bottom: 28px solid #131849;
  }
  .l { transform: translateX(-135px) rotate(-15deg); --c: #2FD0F0; }
  .r { transform: translateX(135px) rotate(15deg); --c: #B77BFF; }
  .f { --c: linear-gradient(115deg, #FFD23F 0%, #FFF3A6 22%, #FF93DC 46%, #86ECFF 70%, #FFD23F 100%); }
  .f b {
    position: absolute;
    inset: 118px 0 0;
    display: grid;
    place-items: center;
    font: 400 320px/1 'Lilita One', sans-serif;
    color: #131849;
    padding-top: 10px;
  }
</style>
</head>
<body>
  <div class="fan"><div class="card l"></div><div class="card r"></div><div class="card f"><b>W</b></div></div>
  <script>
    const s = new URLSearchParams(location.search).get('s');
    if (s) document.querySelector('.fan').style.setProperty('--s', s);
  </script>
</body>
</html>
